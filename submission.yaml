submission:
  title: "SupplyShield AI"

  problem_statement: >
    Supply chain operations teams face a fragmented, reactive intelligence
    challenge. When disruptions occur, determining which shipments are at risk
    requires manual cross-referencing of carrier data, routes, and cargo
    sensitivity — a process taking 30–60 minutes per incident. Cold-chain
    excursions often go undetected until delivery when product is already
    compromised. Idle fleet assets sit unused because no system connects
    disruption-affected shipments with available nearby vehicles.

  solution_summary: >
    SupplyShield AI is a supply-chain operations intelligence platform with
    an ASP.NET Core / C# primary backend and a separate Python AI/ML service.
    It combines disruption detection, shipment risk scoring, cold-chain
    temperature monitoring, idle fleet identification, and IBM watsonx.ai
    (Granite) grounded recommendations. AI explanations are always based on
    verified backend facts. Every consequential action requires operator
    confirmation and creates an audit record.

  key_features:
    - "Real-time disruption detection with automatic identification of affected shipments and deterministic risk scoring"
    - "Cold-chain temperature monitoring with configurable per-sensor excursion severity classification (MEDIUM/HIGH/CRITICAL)"
    - "Idle fleet vehicle identification with redeployment candidates ranked by capacity, proximity, and compatibility"
    - "IBM watsonx.ai (Granite) grounded explanations via isolated Python AI service — ASP.NET Core backend sends only verified facts"
    - "What-If simulation engine for comparing route/carrier alternatives (ETA, cost, risk) without mutating live operational state"

  tech_stack:
    languages: ["C#", "TypeScript", "Python"]
    frameworks: ["ASP.NET Core", "Entity Framework Core", "React", "Vite", "FastAPI", "scikit-learn"]
    ibm_technologies: ["watsonx.ai", "IBM Granite", "IBM Bob"]
    databases: ["Supabase PostgreSQL"]
    other: ["React Router", "Recharts", "xUnit", "CSS Modules", "SignalR (Phase 15+)"]

  what_we_are_most_proud_of: >
    The clean architectural separation between the primary ASP.NET Core backend,
    the isolated Python AI service, and the IBM watsonx.ai grounding rules.
    The ASP.NET Core backend never imports IBM SDK dependencies — all AI calls
    flow through verified structured facts to the Python service. This prevents
    hallucinated recommendations in an enterprise context where incorrect advice
    could cause major supply-chain or cold-chain failures.

  known_limitations: >
    Phase 2 is the application skeleton only. The frontend uses mock data and
    the ASP.NET Core backend returns placeholder responses. Supabase database
    schema, real service implementations, data ingestion, cold-chain excursion
    engine, fleet intelligence, AI inference (watsonx.ai), What-If simulation,
    ML predictions (scikit-learn), SignalR realtime, authentication, and
    production authorization are all deferred to Phases 3–18.

